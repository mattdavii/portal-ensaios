<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Conversor de Resistência</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1c2128"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script src="/resistencia.js"></script><script src="/ui.js"></script></head><body>
<div class="topbar"><a href="/" class="voltar">⬅ Menu</a><span class="titulo">🧮 Conversor de Resistência</span><span class="spacer"></span></div><div class="container" style="max-width:620px;padding:0"><div class="card-instrumento"><span class="label-tech">Valor a converter</span><div class="row g-2"><div class="col-7"><input type="number" step="any" id="valor" class="form-control dado" placeholder="Valor"></div><div class="col-5"><select id="unidade" class="form-select"><option>µΩ</option><option>mΩ</option><option selected>Ω</option><option>kΩ</option><option>MΩ</option><option>GΩ</option><option>TΩ</option></select></div></div></div><div class="card-instrumento"><span class="label-tech">Resultado</span><div id="resultados"></div></div><div class="norma-tech">Referência rápida: resistência de contato costuma ser registrada em µΩ/mΩ; isolamento em MΩ/GΩ; aterramento em Ω.</div></div>
<script>const U=['µΩ','mΩ','Ω','kΩ','MΩ','GΩ','TΩ'];function fmt(v){if(v===0)return'0';const a=Math.abs(v);if(a<1e-4||a>=1e7)return v.toExponential(3);const o=Math.floor(Math.log10(a));return Number(v.toFixed(Math.max(0,3-o))).toString();}function render(){const v=numeroCampo('valor'),u=textoCampo('unidade'),c=document.getElementById('resultados');if(v===null){c.innerHTML='<div class="text-muted text-center small">Digite um valor.</div>';return;}c.innerHTML=U.map(x=>`<div class="subcard d-flex justify-content-between valor-copiavel" data-v="${converterResistencia(v,u,x)}" data-u="${x}"><b>${x}</b><span class="valor-mono">${fmt(converterResistencia(v,u,x))}</span></div>`).join('');}document.getElementById('valor').addEventListener('input',render);document.getElementById('unidade').addEventListener('change',render);document.getElementById('resultados').addEventListener('click',e=>{const l=e.target.closest('.valor-copiavel');if(!l)return;navigator.clipboard?.writeText(l.dataset.v).then(()=>mostrarToast(`${l.dataset.u} copiado`,'ok'));});render();</script></body></html>
