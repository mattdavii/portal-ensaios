<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desequilíbrio entre Fases</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c2128">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="/ui.js"></script>
<script src="/rascunho.js"></script>
<script src="/resistencia.js"></script>
</head>
<body>

<div class="page-shell">
<section class="page-hero no-print">
  <div class="page-hero-row">
    <a href="/" class="page-back">Menu</a>
    <div class="page-hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V9M10 19V5M16 19v-7M3 19h18"/><path d="M19 5l2 2-2 2"/></svg></div>
    <div class="page-hero-text">
      <h1 class="page-title">Desequilíbrio entre Fases</h1>
      <div class="page-subtitle">Compare três valores e identifique a fase discrepante.</div>
    </div>
  </div>
  <div class="page-chip-row"><span class="page-chip">A/B/C</span><span class="page-chip">Média</span><span class="page-chip">Desvio</span></div>
</section>
<div class="container" style="max-width:620px;padding:0;">

<div class="card-instrumento">
<div class="label-row"><span class="label-tech">Valores</span><button type="button" class="btn-info-ensaio" onclick="abrirInfo('Como funciona', `<p>O Portal calcula a média dos três valores e o desvio percentual de cada fase em relação à média.</p><p>Você pode usar para resistência de contato, resistência ôhmica, corrente, tensão ou qualquer grandeza comparável entre fases.</p><p>O limite de atenção é configurável.</p>` )">i</button></div>
<div class="row g-2 mb-2"><div class="col-4"><label class="field-label">Fase A / R</label><input id="a" type="number" step="any" class="form-control dado" oninput="calc()"></div><div class="col-4"><label class="field-label">Fase B / S</label><input id="b" type="number" step="any" class="form-control dado" oninput="calc()"></div><div class="col-4"><label class="field-label">Fase C / T</label><input id="c" type="number" step="any" class="form-control dado" oninput="calc()"></div></div>
<div class="row g-2"><div class="col-6"><label class="field-label">Unidade</label><input id="unidade" class="form-control" placeholder="A, V, mΩ..."></div><div class="col-6"><label class="field-label">Limite de atenção</label><div class="input-group"><input id="lim" type="number" value="5" min="0.1" step="0.1" class="form-control dado" oninput="calc()"><span class="input-group-text">%</span></div></div></div>
</div>
<div id="resultado" class="card-instrumento d-none"><div id="out"></div></div>
<script>
function calc(){
 const vals=[numeroCampo('a'),numeroCampo('b'),numeroCampo('c')];if(vals.some(v=>v===null)){document.getElementById('resultado').classList.add('d-none');return}
 const media=vals.reduce((x,y)=>x+y,0)/3,lim=numeroCampo('lim')||5,u=textoCampo('unidade');const labels=['A/R','B/S','C/T'];
 let rows='',maxd=0,idx=0;vals.forEach((v,i)=>{const d=media?((v-media)/media)*100:0;if(Math.abs(d)>maxd){maxd=Math.abs(d);idx=i}const st=Math.abs(d)<=lim?STATUS.CONFORME:STATUS.ATENCAO;rows+=`<tr><td>${labels[i]}</td><td class="valor-mono">${v} ${escaparHtml(u)}</td><td>${d>=0?'+':''}${d.toFixed(2)}%</td><td>${badgeStatus(st)}</td></tr>`});
 const geral=maxd<=lim?STATUS.CONFORME:STATUS.ATENCAO;
 document.getElementById('out').innerHTML=`${seloStatus(geral)}<div class="row g-2 mb-3"><div class="col-6"><div class="subcard text-center"><div class="field-label">Média</div><div class="valor-mono fs-5">${media.toFixed(4)} ${escaparHtml(u)}</div></div></div><div class="col-6"><div class="subcard text-center"><div class="field-label">Maior desvio</div><div class="valor-mono fs-5">${maxd.toFixed(2)}%</div><div class="form-hint">Fase ${labels[idx]}</div></div></div></div><table class="table-laudo"><thead><tr><th>Fase</th><th>Valor</th><th>Desvio</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
 document.getElementById('resultado').classList.remove('d-none');
}
</script></div></div></body></html>
