<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Strings CC</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1c2128"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="/ui.js"></script><script src="/rascunho.js"></script></head><body>
<div class="topbar no-print"><a href="/" class="voltar">⬅ Menu</a><span class="titulo">☀️ Strings CC</span><span class="spacer"></span></div><div class="container" style="max-width:650px;padding:0"><form id="formCC">
<div class="card-instrumento"><div class="label-row"><span class="label-tech">Identificação</span><button type="button" class="btn-info-ensaio" onclick="abrirInfo('Strings CC — identificação',INFO_ID)">i</button></div><div class="row g-2 mb-2"><div class="col"><input id="usina" class="form-control" placeholder="Usina" required></div><div class="col"><input id="tecnico" class="form-control" placeholder="Técnico"></div></div><div class="row g-2"><div class="col"><input id="os" class="form-control" placeholder="OS"></div><div class="col"><input id="skid" class="form-control" placeholder="SKID"></div><div class="col"><input id="inversor" class="form-control" placeholder="Inversor"></div></div></div>
<div class="card-instrumento"><div class="label-row"><span class="label-tech">Dados do módulo / string</span><button type="button" class="btn-info-ensaio" onclick="abrirInfo('Voc corrigida por temperatura',INFO_VOC)">i</button></div><div class="row g-2 mb-2"><div class="col"><label class="field-label">Módulos/string</label><input type="number" id="n_modulos" class="form-control dado" required></div><div class="col"><label class="field-label">Voc STC módulo (V)</label><input type="number" step="any" id="voc_stc" class="form-control dado" required></div><div class="col"><label class="field-label">βVoc (%/°C)</label><input type="number" step="any" id="beta_voc" class="form-control dado" required></div></div><div class="row g-2"><div class="col-6"><label class="field-label">Temperatura do módulo (°C)</label><input type="number" step="any" id="temperatura_modulo" class="form-control dado" required></div><div class="col-6"><label class="field-label">Tolerância Voc</label><select id="tol_voc" class="form-select"><option value="0.03">3%</option><option value="0.05" selected>5%</option><option value="custom">Personalizada</option></select></div></div><div id="tol_custom_box" class="row g-2 mt-1 d-none"><div class="col-6"><label class="field-label">Tolerância personalizada (%)</label><input type="number" step="any" id="tol_custom" class="form-control dado" value="5"></div></div></div>
<div class="card-instrumento"><div class="label-row"><span class="label-tech">Diagnóstico por tensão para terra</span><button type="button" class="btn-info-ensaio" onclick="abrirInfo('Diagnóstico V+/PE e V-/PE',INFO_TERRA)">i</button></div><span class="norma-tech">Esta etapa é <b>diagnóstica</b>. O Portal compara |V+/PE| + |V-/PE| com a Voc medida. Não considera simplesmente “abaixo de 120 V = conforme”.</span><div class="row g-2 mb-2"><div class="col-6"><label class="field-label">Quantidade de strings</label><input type="number" id="qtd_strings" min="1" max="40" class="form-control dado" oninput="gerarStrings()"></div></div><div id="strings"></div></div>
<div class="card-instrumento"><div class="label-row"><span class="label-tech">RISO da string (opcional)</span><button type="button" class="btn-info-ensaio" onclick="abrirInfo('Resistência de isolamento da string',INFO_RISO)">i</button></div><div class="row g-2"><div class="col"><label class="field-label">Tensão de ensaio (V)</label><input type="number" step="any" id="tensao_riso" class="form-control dado"></div><div class="col"><label class="field-label">RISO (MΩ)</label><input type="number" step="any" id="riso" class="form-control dado"></div></div></div>
<div class="card-instrumento"><span class="label-tech">Observações</span><textarea id="observacoes" class="form-control" rows="3"></textarea></div><button class="btn btn-instrumento" type="submit">GERAR REGISTRO E SALVAR</button></form><div id="box_laudo" class="card-instrumento d-none mt-4"><h6 class="text-center fw-bold border-bottom pb-2">REGISTRO DE CAMPO — STRINGS CC</h6><div id="laudo_render"></div><div class="row g-2 mt-3 no-print"><div class="col"><button class="btn btn-instrumento-outline" onclick="baixarPDF('box_laudo','Strings_CC',textoCampo('inversor')||'Strings')">Baixar PDF</button></div><div class="col"><button class="btn btn-instrumento" onclick="compartilharPDF('box_laudo','Strings_CC',textoCampo('inversor')||'Strings')">Compartilhar PDF</button></div></div></div></div>
<script>
const INFO_ID=`<h6>Uso em campo</h6><p>Usina e Técnico ficam memorizados localmente. A OS permanece específica de cada atividade.</p>`;
const INFO_VOC=`<h6>Por que usar a temperatura do módulo</h6><p>A tensão de circuito aberto varia com a temperatura das células/módulo. Por isso o Portal corrige a Voc de referência usando <b>temperatura do módulo</b>, e não apenas a temperatura ambiente.</p><h6>Cálculo</h6><p>Voc esperada = quantidade de módulos × Voc STC × correção pelo coeficiente βVoc.</p><h6>Tolerância</h6><p>Você pode selecionar 3%, 5% ou informar uma tolerância personalizada conforme o critério adotado no ensaio ou no datasheet.</p>`;
const INFO_TERRA=`<h6>O que está sendo medido</h6><p>São registradas a Voc total da string, a tensão do polo positivo para terra (V+/PE) e a tensão do polo negativo para terra (V-/PE).</p><h6>Por que usar módulo das tensões</h6><p>Dependendo da referência e do sentido das pontas do multímetro, V-/PE pode aparecer com sinal negativo. Para avaliar a distribuição de potencial, o Portal usa os <b>módulos</b> das tensões.</p><h6>Como o diagnóstico funciona</h6><p>Em uma string flutuante, a soma aproximada |V+/PE| + |V-/PE| tende a ser coerente com a Voc entre polos. O Portal compara essa soma com a Voc e usa uma faixa operacional de 8% para sinalizar padrões fora do esperado.</p><h6>Importante</h6><p>Esse comportamento é apenas um <b>indicador de campo</b>. Uma tensão aparentemente coerente não comprova ausência de fuga. Quando houver suspeita, o diagnóstico deve ser confirmado por ensaio de resistência de isolamento e procedimentos aplicáveis.</p>`;
const INFO_RISO=`<h6>Função</h6><p>O ensaio de isolamento é a confirmação mais direta quando o diagnóstico de tensões para terra indicar possível fuga.</p><h6>Status do Portal</h6><p><b>≥ 1000 MΩ:</b> CONFORME.<br><b>&lt; 1000 MΩ:</b> APROVADO COM RESSALVA.</p>`;
document.getElementById('tol_voc').addEventListener('change',()=>document.getElementById('tol_custom_box').classList.toggle('d-none',textoCampo('tol_voc')!=='custom'));
function tolerancia(){return textoCampo('tol_voc')==='custom'?(numeroCampo('tol_custom')??5)/100:Number(textoCampo('tol_voc'));}
function gerarStrings(){const q=Math.min(40,Math.max(0,parseInt(document.getElementById('qtd_strings').value)||0)),c=document.getElementById('strings');c.innerHTML='';for(let i=1;i<=q;i++)c.innerHTML+=`<div class="subcard"><div class="row g-2"><div class="col-3"><input id="tag_${i}" class="form-control dado" value="ST ${i}" placeholder="TAG"></div><div class="col-3"><input type="number" step="any" id="voc_${i}" class="form-control dado" placeholder="Voc"></div><div class="col-3"><input type="number" step="any" id="vp_${i}" class="form-control dado" placeholder="V+/T"></div><div class="col-3"><input type="number" step="any" id="vn_${i}" class="form-control dado" placeholder="V-/T"></div></div></div>`;}
function vocEsperada(){const n=numeroCampo('n_modulos'),v=numeroCampo('voc_stc'),b=numeroCampo('beta_voc'),t=numeroCampo('temperatura_modulo');return[n,v,b,t].some(x=>x===null)?null:n*v*(1+(b/100)*(t-25));}
document.getElementById('formCC').addEventListener('submit',async e=>{e.preventDefault();salvarContextoCampo();const q=parseInt(document.getElementById('qtd_strings').value)||0,ve=vocEsperada(),tol=tolerancia(),riso=numeroCampo('riso'),stRiso=statusIsolamento(riso);let rows='',payloads=[],sts=[];for(let i=1;i<=q;i++){const tag=textoCampo(`tag_${i}`)||`ST ${i}`,voc=numeroCampo(`voc_${i}`),vp=numeroCampo(`vp_${i}`),vn=numeroCampo(`vn_${i}`);if(voc===null||vp===null||vn===null)continue;const dev=ve?Math.abs(voc-ve)/Math.abs(ve)*100:null,stVoc=(dev!==null&&dev<=tol*100)?STATUS.CONFORME:STATUS.ATENCAO,fech=Math.abs((Math.abs(vp)+Math.abs(vn))-Math.abs(voc))/Math.abs(voc)*100,stDiag=fech<=8?STATUS.CONFORME:STATUS.ATENCAO,geral=statusGeral([stVoc,stDiag,stRiso]);sts.push(geral);rows+=`<tr><td>${escaparHtml(tag)}</td><td>${voc.toFixed(2)}</td><td>${Math.abs(vp).toFixed(2)}</td><td>${Math.abs(vn).toFixed(2)}</td><td>${dev===null?'-':dev.toFixed(2)+'%'}</td><td>${fech.toFixed(2)}%</td><td>${badgeStatus(geral)}</td></tr>`;payloads.push({usina:textoCampo('usina'),tag,tecnico:textoCampo('tecnico')||null,os:textoCampo('os')||null,observacoes:textoCampo('observacoes')||null,skid:textoCampo('skid')||null,inversor:textoCampo('inversor')||null,origem:'Campo',destino:'Campo',voc,v_pos_terra:vp,v_neg_terra:vn,n_modulos:numeroCampo('n_modulos'),voc_stc:numeroCampo('voc_stc'),beta_voc:numeroCampo('beta_voc'),temperatura_modulo:numeroCampo('temperatura_modulo'),tolerancia_voc:tol,riso_mohm:riso,tensao_riso_v:numeroCampo('tensao_riso')});}await salvarLoteComFila('/api/sync/cabos-cc',payloads,'Strings salvas');limparRascunho('cabos_cc');const geral=statusGeral(sts);document.getElementById('laudo_render').innerHTML=`${seloStatus(geral)}<div class="header-laudo"><b>Usina:</b> ${escaparHtml(textoCampo('usina'))}<br><b>SKID:</b> ${escaparHtml(textoCampo('skid')||'-')} &nbsp; <b>Inversor:</b> ${escaparHtml(textoCampo('inversor')||'-')} &nbsp; <b>OS:</b> ${escaparHtml(textoCampo('os')||'-')}<br><b>Técnico:</b> ${escaparHtml(textoCampo('tecnico')||'-')}<br><b>Temperatura módulo:</b> ${numeroCampo('temperatura_modulo')??'-'} °C &nbsp; <b>Voc esperada:</b> ${ve===null?'-':ve.toFixed(2)+' V'} &nbsp; <b>Tolerância:</b> ${(tol*100).toFixed(1)}%<br><b>Data/Hora:</b> ${dataHoraLocalTexto()}</div><table class="table-laudo"><tr><th>String</th><th>Voc</th><th>|V+/T|</th><th>|V-/T|</th><th>Desv. Voc</th><th>Fechamento</th><th>Status</th></tr>${rows}</table><div class="norma-tech"><b>Diagnóstico:</b> o fechamento entre tensões para terra e Voc é uma ferramenta auxiliar. Não substitui ensaio de resistência de isolamento quando houver suspeita de fuga.</div><span class="label-tech">RISO opcional</span><div class="mb-3">${riso===null?'Não realizado':`${riso} MΩ @ ${numeroCampo('tensao_riso')??'-'} V — ${badgeStatus(stRiso)}`}</div><span class="label-tech">Observações</span><div class="observacao-laudo">${escaparHtml(textoCampo('observacoes')||'Sem observações.')}</div>`;document.getElementById('box_laudo').classList.remove('d-none');document.getElementById('box_laudo').scrollIntoView({behavior:'smooth'});});iniciarRascunho('cabos_cc');
</script></body></html>
