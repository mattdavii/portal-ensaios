<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Comparador de Strings</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c2128">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="/ui.js"></script>
<script src="/rascunho.js"></script>
<script src="/resistencia.js"></script>
</head>
<body>

<div class="page-shell">
<section class="page-hero no-print">
  <div class="page-hero-row">
    <a href="/" class="page-back">Menu</a>
    <div class="page-hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 18V8M9 18V5M14 18v-7M19 18V3"/><path d="M3 21h18"/></svg></div>
    <div class="page-hero-text">
      <h1 class="page-title">Comparador de Strings</h1>
      <div class="page-subtitle">Compare correntes de várias strings do mesmo MPPT.</div>
    </div>
  </div>
  <div class="page-chip-row"><span class="page-chip">Diagnóstico</span><span class="page-chip">Média</span><span class="page-chip">Desvio %</span></div>
</section>
<div class="container" style="max-width:620px;padding:0;">

<div class="card-instrumento">
  <div class="label-row"><span class="label-tech">Configuração</span>
  <button type="button" class="btn-info-ensaio" onclick="abrirInfo('Como interpretar', `
    <h6>Objetivo</h6><p>Comparar strings submetidas a condições semelhantes para identificar circuitos com corrente significativamente abaixo do conjunto.</p>
    <h6>Como funciona</h6><p>O Portal calcula a média das correntes informadas e o desvio percentual de cada string em relação à média.</p>
    <h6>Uso recomendado</h6><p>Compare preferencialmente strings do mesmo MPPT, com mesma configuração de módulos e sob condições de irradiância semelhantes.</p>
    <h6>Critério</h6><p>O limite de atenção é configurável. O padrão inicial é <b>10%</b> abaixo da média.</p>` )">i</button></div>
  <div class="row g-2">
    <div class="col-6"><label class="field-label">Quantidade de strings</label><input type="number" id="qtd_strings" min="2" max="100" value="10" class="form-control dado" oninput="gerar()"></div>
    <div class="col-6"><label class="field-label">Limite de atenção</label><div class="input-group"><input type="number" id="limite" min="1" step="1" value="10" class="form-control dado" oninput="calcular()"><span class="input-group-text">%</span></div></div>
  </div>
</div>
<div class="card-instrumento"><span class="label-tech">Correntes</span><div id="lista"></div></div>
<div class="card-instrumento d-none" id="resultado"><div id="saida"></div></div>
<script>
function gerar(){
  const q=parseInt(document.getElementById('qtd_strings').value||'0',10),box=document.getElementById('lista');box.innerHTML='';
  for(let i=1;i<=q;i++) box.insertAdjacentHTML('beforeend',`<div class="row g-2 mb-2 align-items-center"><div class="col-5"><input id="tag_${i}" class="form-control form-control-sm" value="String ${i}"></div><div class="col-7"><div class="input-group"><input id="i_${i}" type="number" step="0.01" class="form-control dado" oninput="calcular()"><span class="input-group-text">A</span></div></div></div>`);
  calcular();
}
function calcular(){
 const q=parseInt(document.getElementById('qtd_strings').value||'0',10),lim=Number(document.getElementById('limite').value||10);
 const vals=[];for(let i=1;i<=q;i++){const v=numeroCampo(`i_${i}`);if(v!==null)vals.push({i,v,tag:textoCampo(`tag_${i}`)})}
 if(vals.length<2){document.getElementById('resultado').classList.add('d-none');return}
 const media=vals.reduce((a,b)=>a+b.v,0)/vals.length;
 let rows='',min=Infinity,max=-Infinity;
 vals.forEach(x=>{const d=((x.v-media)/media)*100;min=Math.min(min,x.v);max=Math.max(max,x.v);const st=d<=-lim?STATUS.ATENCAO:STATUS.CONFORME;rows+=`<tr><td>${escaparHtml(x.tag)}</td><td class="valor-mono">${x.v.toFixed(2)} A</td><td class="${st===STATUS.ATENCAO?'text-warning':''}">${d>=0?'+':''}${d.toFixed(1)}%</td><td>${badgeStatus(st)}</td></tr>`})
 const dispersao=media?((max-min)/media)*100:0;
 document.getElementById('saida').innerHTML=`<div class="row g-2 mb-3"><div class="col-6"><div class="subcard text-center"><div class="field-label">Média</div><div class="valor-mono fs-5">${media.toFixed(2)} A</div></div></div><div class="col-6"><div class="subcard text-center"><div class="field-label">Dispersão máx-mín</div><div class="valor-mono fs-5">${dispersao.toFixed(1)}%</div></div></div></div><table class="table-laudo"><thead><tr><th>String</th><th>Corrente</th><th>Desvio</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
 document.getElementById('resultado').classList.remove('d-none');
}
gerar();
</script></div></div></body></html>
