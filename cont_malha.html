<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Continuidade da Malha</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1c2128"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="/ui.js"></script><script src="/rascunho.js"></script></head><body>
<div class="page-shell">
<section class="page-hero no-print">
  <div class="page-hero-row">
    <a href="/" class="page-back">← Menu</a>
    <div class="page-hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12h4l2-5 4 10 2-5h4"/></svg></div>
    <div class="page-hero-text"><h1 class="page-title">Continuidade da Malha</h1><div class="page-subtitle">Verificação da integridade das ligações.</div></div>
  </div>
  <div class="page-chip-row"><span class="page-chip">⚡ Campo</span><span class="page-chip">✓ Validação</span><span class="page-chip">▣ PDF para OS</span></div>
</section>
<div class="container" style="max-width:620px;padding:0;"><form id="formCont">
<div class="card-instrumento"><div class="label-row"><span class="label-tech">Identificação</span><button type="button" class="btn-info-ensaio" onclick="abrirInfo('Continuidade da malha',INFO)">i</button></div><div class="row g-2 mb-2"><div class="col"><input id="usina" class="form-control" placeholder="Usina" required></div><div class="col"><input id="tecnico" class="form-control" placeholder="Técnico"></div></div><div class="row g-2"><div class="col"><input id="os" class="form-control" placeholder="OS"></div><div class="col"><input id="tag" class="form-control dado" placeholder="TAG / Área" required></div></div></div>
<div class="card-instrumento"><span class="norma-tech">Critério interno mantido: ≤ 1000 mΩ → CONFORME; acima → ATENÇÃO. Não é utilizado “REFAZER”.</span><div class="row g-2 align-items-end"><div class="col-8"><label class="field-label">Quantidade de pontos</label><input type="number" id="qtd_pontos" min="1" max="30" class="form-control dado" value="3" oninput="gerarPontos()"></div></div><div id="pontos" class="mt-3"></div></div>
<div class="card-instrumento"><span class="label-tech">Observações</span><textarea id="observacoes" class="form-control" rows="3"></textarea></div><button type="submit" class="btn btn-instrumento">GERAR REGISTRO E SALVAR</button></form><div id="box_laudo" class="card-instrumento d-none mt-4"><h6 class="text-center fw-bold border-bottom pb-2">REGISTRO DE CAMPO — CONTINUIDADE DA MALHA</h6><div id="laudo_render"></div><div class="row g-2 mt-3 no-print"><div class="col"><button class="btn btn-instrumento-outline" onclick="baixarPDF('box_laudo','Continuidade',textoCampo('tag'))">Baixar PDF</button></div><div class="col"><button class="btn btn-instrumento" onclick="compartilharPDF('box_laudo','Continuidade',textoCampo('tag'))">Compartilhar PDF</button></div></div></div></div>
<script>
const INFO=`<h6>O que é</h6><p>O ensaio verifica a continuidade elétrica dos caminhos de equipotencialização e aterramento entre os pontos selecionados.</p><h6>Como o Portal avalia</h6><p>É mantida a referência interna de <b>1000 mΩ (1 Ω)</b>. Até esse valor: CONFORME. Acima: ATENÇÃO. O Portal não classifica esse resultado como REFAZER.</p>`;
function gerarPontos(){const q=Math.min(30,Math.max(0,parseInt(document.getElementById('qtd_pontos').value)||0)),c=document.getElementById('pontos');c.innerHTML='';for(let i=1;i<=q;i++)c.innerHTML+=`<div class="row g-2 mb-2"><div class="col-7"><input id="pt_nome_${i}" class="form-control" placeholder="Ponto ${i}"></div><div class="col-5"><input type="number" step="any" id="pt_res_${i}" class="form-control dado" placeholder="mΩ"></div></div>`;}
document.getElementById('formCont').addEventListener('submit',async e=>{e.preventDefault();salvarContextoCampo();const q=parseInt(document.getElementById('qtd_pontos').value)||0;let rows='',payloads=[],sts=[];for(let i=1;i<=q;i++){const nome=textoCampo(`pt_nome_${i}`),res=numeroCampo(`pt_res_${i}`),st=(!nome||res===null)?STATUS.NAO_AVALIADO:(res<=1000?STATUS.CONFORME:STATUS.ATENCAO);sts.push(st);rows+=`<tr><td>${escaparHtml(nome||'-')}</td><td>${res===null?'-':res+' mΩ'}</td><td>${badgeStatus(st)}</td></tr>`;payloads.push({usina:textoCampo('usina'),tag:textoCampo('tag'),tecnico:textoCampo('tecnico')||null,os:textoCampo('os')||null,observacoes:textoCampo('observacoes')||null,pt1_nome:nome||'',pt1_res:res,pt2_nome:null,pt2_res:null,pt3_nome:null,pt3_res:null});}await salvarLoteComFila('/api/sync/cont-malha',payloads,'Continuidade salva');limparRascunho('cont_malha');const geral=statusGeral(sts);document.getElementById('laudo_render').innerHTML=`${seloStatus(geral)}<div class="header-laudo"><b>Usina:</b> ${escaparHtml(textoCampo('usina'))}<br><b>TAG:</b> ${escaparHtml(textoCampo('tag'))} &nbsp; <b>OS:</b> ${escaparHtml(textoCampo('os')||'-')}<br><b>Técnico:</b> ${escaparHtml(textoCampo('tecnico')||'-')}<br><b>Data/Hora:</b> ${dataHoraLocalTexto()}</div><table class="table-laudo"><tr><th>Ponto</th><th>Resistência</th><th>Status</th></tr>${rows}</table><span class="label-tech">Observações</span><div class="observacao-laudo">${escaparHtml(textoCampo('observacoes')||'Sem observações.')}</div>`;document.getElementById('box_laudo').classList.remove('d-none');document.getElementById('box_laudo').scrollIntoView({behavior:'smooth'});});gerarPontos();iniciarRascunho('cont_malha');
</script></div>
</body></html>
