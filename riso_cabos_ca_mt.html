<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RISO de Cabos CA/MT</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c2128">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="/ui.js"></script>
<script src="/rascunho.js"></script>
<script src="/resistencia.js"></script>
</head>
<body>

<div class="page-shell">
<section class="page-hero no-print">
  <div class="page-hero-row">
    <a href="/" class="page-back">Menu</a>
    <div class="page-hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12h5l2-6 4 12 2-6h3"/><path d="M5 19h14"/><path d="M8 3h8"/></svg></div>
    <div class="page-hero-text">
      <h1 class="page-title">RISO de Cabos CA/MT</h1>
      <div class="page-subtitle">Ensaio de isolamento de alimentadores trifásicos.</div>
    </div>
  </div>
  <div class="page-chip-row"><span class="page-chip">Ensaio</span><span class="page-chip">Fase-Terra</span><span class="page-chip">Fase-Fase</span><span class="page-chip">PDF</span></div>
</section>
<div class="container" style="max-width:620px;padding:0;">

<form id="formRisoCa">
<div class="card-instrumento">
<div class="label-row"><span class="label-tech">Identificação</span>
<button type="button" class="btn-info-ensaio" onclick="abrirInfo('Preparação do ensaio', `<h6>Antes do ensaio</h6><p>O circuito deve estar desenergizado, isolado e liberado conforme o procedimento de segurança aplicável.</p><h6>Conexões</h6><p>Desconecte ou isole equipamentos eletrônicos, DPS, transformadores de potencial e demais componentes que possam ser danificados pela tensão do megôhmetro.</p><h6>Após o ensaio</h6><p>Descarregue o cabo/circuito conforme procedimento do instrumento antes de qualquer reconexão.</p>` )">i</button></div>
<div class="row g-2 mb-2"><div class="col-7"><label class="field-label">Usina</label><input id="usina" class="form-control" required></div><div class="col-5"><label class="field-label">OS</label><input id="os" class="form-control"></div></div>
<div class="row g-2 mb-2"><div class="col-7"><label class="field-label">Técnico</label><input id="tecnico" class="form-control" required></div><div class="col-5"><label class="field-label">TAG / Circuito</label><input id="tag" class="form-control" required></div></div>
<div class="row g-2"><div class="col-6"><label class="field-label">Classe do circuito</label><select id="classe_circuito" class="form-select"><option value="CA">CA / BT</option><option value="MT">MT</option></select></div><div class="col-6"><label class="field-label">Tensão de ensaio</label><select id="tensao_ensaio" class="form-select" required><option value="">Selecione</option><option>500</option><option>1000</option><option>2500</option><option>5000</option><option>10000</option></select></div></div>
</div>
<div class="card-instrumento">
<div class="label-row"><span class="label-tech">Resistência de Isolamento</span>
<button type="button" class="btn-info-ensaio" onclick="abrirInfo('Critério interno', `<p><b>≥ 1000 MΩ: CONFORME</b></p><p><b>&lt; 1000 MΩ: APROVADO COM RESSALVA</b></p><p>O valor deve ser interpretado considerando tensão de ensaio, comprimento do circuito, condições ambientais e procedimento aplicável.</p>` )">i</button></div>
<div class="section-title-tech">Fase → Terra</div>
<div class="row g-2 mb-3">
<div class="col-4"><label class="field-label">R → Terra</label><div class="input-group"><input id="rt" type="number" min="0" step="0.001" class="form-control dado"><span class="input-group-text">MΩ</span></div></div>
<div class="col-4"><label class="field-label">S → Terra</label><div class="input-group"><input id="st" type="number" min="0" step="0.001" class="form-control dado"><span class="input-group-text">MΩ</span></div></div>
<div class="col-4"><label class="field-label">T → Terra</label><div class="input-group"><input id="tt" type="number" min="0" step="0.001" class="form-control dado"><span class="input-group-text">MΩ</span></div></div>
</div>
<div class="section-title-tech">Fase → Fase</div>
<div class="row g-2">
<div class="col-4"><label class="field-label">R → S</label><div class="input-group"><input id="rs" type="number" min="0" step="0.001" class="form-control dado"><span class="input-group-text">MΩ</span></div></div>
<div class="col-4"><label class="field-label">S → T</label><div class="input-group"><input id="st_ff" type="number" min="0" step="0.001" class="form-control dado"><span class="input-group-text">MΩ</span></div></div>
<div class="col-4"><label class="field-label">T → R</label><div class="input-group"><input id="tr" type="number" min="0" step="0.001" class="form-control dado"><span class="input-group-text">MΩ</span></div></div>
</div>
</div>
<div class="card-instrumento"><span class="label-tech">Observações</span><textarea id="observacoes" class="form-control" rows="3"></textarea></div>
<button type="submit" class="btn btn-instrumento no-print">GERAR REGISTRO E SALVAR</button>
</form>
<div id="box_laudo" class="card-instrumento d-none mt-3"><h6 class="text-center fw-bold border-bottom pb-2 mb-3">REGISTRO DE CAMPO — RISO CABOS CA/MT</h6><div id="laudo_render"></div><div class="page-actions two no-print"><button class="btn btn-instrumento-outline" onclick="baixarPDF('box_laudo','RISO_Cabos',textoCampo('tag'))">Baixar PDF</button><button class="btn btn-instrumento" onclick="compartilharPDF('box_laudo','RISO_Cabos',textoCampo('tag'))">Compartilhar PDF</button></div></div>
<script>
function stIso(v){return v===null?STATUS.NAO_AVALIADO:(v>=1000?STATUS.CONFORME:STATUS.RESSALVA)}
document.getElementById('formRisoCa').addEventListener('submit',async e=>{
 e.preventDefault();salvarContextoCampo();
 const vals={rt:numeroCampo('rt'),st:numeroCampo('st'),tt:numeroCampo('tt'),rs:numeroCampo('rs'),st_ff:numeroCampo('st_ff'),tr:numeroCampo('tr')};

 const leiturasValidas=Object.values(vals).filter(v=>v!==null);

 if(leiturasValidas.length===0){
   alert('Informe pelo menos uma medição de resistência de isolamento antes de gerar o registro.');
   return;
 }

 const sts=Object.fromEntries(Object.entries(vals).map(([k,v])=>[k,stIso(v)])),geral=statusGeral(Object.values(sts));
 const payload={usina:textoCampo('usina'),tag:textoCampo('tag'),tecnico:textoCampo('tecnico')||null,os:textoCampo('os')||null,observacoes:textoCampo('observacoes')||null,classe_circuito:textoCampo('classe_circuito'),tensao_ensaio_v:numeroCampo('tensao_ensaio'),r_terra:vals.rt,s_terra:vals.st,t_terra:vals.tt,rs:vals.rs,st:vals.st_ff,tr:vals.tr};
 await salvarComFila('/api/sync/riso-cabos-ca-mt',payload,'RISO de cabos salvo');
 const cel=(v,s)=>`<span class="valor-mono">${v??'-'}</span><br>${badgeStatus(s)}`;
 document.getElementById('laudo_render').innerHTML=`${seloStatus(geral)}<div class="header-laudo"><div class="row g-2"><div class="col-6"><b>Usina:</b> ${escaparHtml(payload.usina)}</div><div class="col-6"><b>OS:</b> ${escaparHtml(payload.os||'-')}</div><div class="col-6"><b>Técnico:</b> ${escaparHtml(payload.tecnico||'-')}</div><div class="col-6"><b>Data/hora:</b> ${dataHoraLocalTexto()}</div><div class="col-6"><b>Circuito:</b> ${escaparHtml(payload.tag)}</div><div class="col-6"><b>Tensão de ensaio:</b> ${payload.tensao_ensaio_v} V</div></div></div><table class="table-laudo"><thead><tr><th>R-Terra</th><th>S-Terra</th><th>T-Terra</th><th>R-S</th><th>S-T</th><th>T-R</th></tr></thead><tbody><tr><td>${cel(vals.rt,sts.rt)}</td><td>${cel(vals.st,sts.st)}</td><td>${cel(vals.tt,sts.tt)}</td><td>${cel(vals.rs,sts.rs)}</td><td>${cel(vals.st_ff,sts.st_ff)}</td><td>${cel(vals.tr,sts.tr)}</td></tr></tbody></table><div class="mt-3"><b>Observações</b><div class="observacao-laudo mt-1">${escaparHtml(payload.observacoes||'-')}</div></div>`;
 limparRascunho('riso_cabos_ca_mt');document.getElementById('box_laudo').classList.remove('d-none');document.getElementById('box_laudo').scrollIntoView({behavior:'smooth'});
});
iniciarRascunho('riso_cabos_ca_mt');
</script></div></div></body></html>
